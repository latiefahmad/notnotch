name: Feature request
description: Suggest a new tool, an integration or a change to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please search the open issues first, in case someone already asked for it.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, in your own words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could NotNotch help?
      description: What it would look like in the notch or the open panel. Sketches and examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Services or APIs it would need, privacy concerns, links.
