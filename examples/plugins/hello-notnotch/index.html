<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello NotNotch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="timer">
        <div id="clock" class="clock">0:00</div>
        <div class="buttons">
          <button data-min="5">5 min</button>
          <button data-min="15">15 min</button>
          <button data-min="25">25 min</button>
          <button id="stop" hidden>Stop</button>
        </div>
      </section>
      <section class="zen">
        <p id="zen">…</p>
        <button id="again">Another line</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
